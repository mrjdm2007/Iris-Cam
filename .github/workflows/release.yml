name: Publish Iris Cam Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare private release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.IRIS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iris-release.jks"
          fi

      - name: Verify production signing configuration
        env:
          STORE_PASSWORD: ${{ secrets.IRIS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IRIS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IRIS_RELEASE_KEY_PASSWORD }}
        run: |
          test -s "$RUNNER_TEMP/iris-release.jks" || { echo "Missing IRIS_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing IRIS_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing IRIS_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing IRIS_RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Build release APK
        env:
          IRIS_RELEASE_STORE_FILE: ${{ runner.temp }}/iris-release.jks
          IRIS_RELEASE_STORE_PASSWORD: ${{ secrets.IRIS_RELEASE_STORE_PASSWORD }}
          IRIS_RELEASE_KEY_ALIAS: ${{ secrets.IRIS_RELEASE_KEY_ALIAS }}
          IRIS_RELEASE_KEY_PASSWORD: ${{ secrets.IRIS_RELEASE_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 1 ]; then
              gradle assembleRelease --no-daemon && break
            else
              gradle --refresh-dependencies assembleRelease --no-daemon && break
            fi
            echo "Release build attempt $attempt failed; retrying after a short delay"
            sleep $((attempt * 20))
          done
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "IrisCam-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: IrisCam-${{ github.ref_name }}.apk
