name: Publish Iris Cam APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build versioned APK
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" ]]; then
            gradle assembleRelease --no-daemon -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION"
            cp app/build/outputs/apk/release/app-release.apk dist/IrisCam.apk
            echo "Built a release APK signed with the persistent upload key."
          else
            gradle assembleDebug --no-daemon -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION"
            cp app/build/outputs/apk/debug/app-debug.apk dist/IrisCam.apk
            echo "::warning::No signing key configured. This is a debug-signed APK; later CI builds may require uninstalling the previous build before installing."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Iris Cam ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/IrisCam.apk
