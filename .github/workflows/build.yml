name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'feature/**', 'ui-layout-wireless-guide', 'workflow-378-camera-fixes', 'workflow-497-camera-features', 'workflow-498-video-exposure-lock-release']
  pull_request:
    branches: [main, master, 'workflow-497-camera-features', 'workflow-498-video-exposure-lock-release', 'workflow-499-exposure-release-fixes']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare private release signing key
        if: ${{ secrets.IRIS_RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.IRIS_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iris-release.jks"

      - name: Build debug and release APKs
        env:
          IRIS_RELEASE_STORE_FILE: ${{ runner.temp }}/iris-release.jks
          IRIS_RELEASE_STORE_PASSWORD: ${{ secrets.IRIS_RELEASE_STORE_PASSWORD }}
          IRIS_RELEASE_KEY_ALIAS: ${{ secrets.IRIS_RELEASE_KEY_ALIAS }}
          IRIS_RELEASE_KEY_PASSWORD: ${{ secrets.IRIS_RELEASE_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: IrisCam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IrisCam-v1.1.0-release-apk
          path: app/build/outputs/apk/release/app-release.apk
